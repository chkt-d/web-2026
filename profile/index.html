<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <header class="sidebar">
        <ul class="sidebar__list">
            <li class="sidebar__item">
                <a href="#">
                    <img src="assets/home.png" alt="Главная">
                </a>
            </li>
            <li class="sidebar__item">
                <a href="#">
                    <img src="assets/profile.png" alt="Профиль">
                </a>
            </li>
            <li class="sidebar__item">
                <a href="#">
                    <img src="assets/plus.png" alt="Добавить">
                </a>
            </li>
        </ul>
    </header>

    <main class="content">
        <section class="profile">
            <div class="profile__info">
                <img src="assets/avatar1.png" alt="Ваня Денисов" class="profile__avatar">
                <h1 class="profile__name">Ваня Денисов</h1>
                <p class="profile__bio">
                    Привет! Я системный аналитик в ACME :) Тут моя жизнь только для самых классных!
                </p>
                <div class="profile__stats">
                    <img src="assets/grid_icon.png" alt="Иконка сетки" class="profile__stats-icon">
                    <span class="profile__posts-count">43 поста</span>
                </div>
            </div>

            <div class="grid">
                <div class="grid__item">
                    <img src="assets/snow_city.png" alt="Снежный город" class="grid__image">
                </div>
                <div class="grid__item">
                    <img src="assets/building.png" alt="Здание" class="grid__image">
                </div>
                <div class="grid__item">
                    <img src="assets/dessert.png" alt="Десерт" class="grid__image">
                </div>
                <div class="grid__item">
                    <img src="assets/friends.png" alt="Друзья" class="grid__image">
                </div>
                <div class="grid__item">
                    <img src="assets/coffee.png" alt="Кофе" class="grid__image">
                </div>
                <div class="grid__item">
                    <img src="assets/book.png" alt="Книга" class="grid__image">
                </div>
            </div>
        </section>
    </main>

</body>
</html>
